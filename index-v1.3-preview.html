<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NotebookLM Podcasts</title>

    <style>
        :root {
            --bg: #0b0b0d;
            --surface: #141417;
            --surface-hover: #19191d;
            --border: rgba(255, 255, 255, 0.09);
            --text: #f5f5f5;
            --muted: #96969f;
            --accent: #a78bfa;
            --accent-2: #7c3aed;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(124, 58, 237, 0.16),
                    transparent 38%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: min(900px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* Header */

        header {
            padding: 80px 0 55px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 14px rgba(167, 139, 250, 0.7);
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 4.8rem);
            line-height: 0.98;
            letter-spacing: -0.055em;
            font-weight: 800;
        }

        .intro {
            max-width: 600px;
            margin: 24px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* Episode list */

        #podcast-list {
            display: grid;
            gap: 14px;
            padding-bottom: 80px;
        }

        .card {
            position: relative;
            padding: 26px;
            overflow: hidden;

            background: rgba(20, 20, 23, 0.82);
            border: 1px solid var(--border);
            border-radius: 18px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 180ms ease,
                border-color 180ms ease,
                background 180ms ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(167, 139, 250, 0.5),
                transparent
            );
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background: var(--surface-hover);
            border-color: rgba(167, 139, 250, 0.22);
        }

        .card:hover::before {
            opacity: 1;
        }

        .episode-number {
            margin-bottom: 12px;
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .card h2 {
            margin: 0;
            font-size: clamp(1.25rem, 3vw, 1.6rem);
            line-height: 1.25;
            letter-spacing: -0.025em;
        }

        .card p {
            max-width: 700px;
            margin: 12px 0 20px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.65;
        }

        /* Audio player */

        audio {
            display: block;
            width: 100%;
            height: 42px;
            margin-top: 18px;
            border-radius: 10px;
        }

        /* Loading */

        .loading {
            padding: 50px 0;
            color: var(--muted);
            text-align: center;
        }

        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .error {
            padding: 22px;
            color: #fca5a5;
            background: rgba(127, 29, 29, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.18);
            border-radius: 14px;
        }

        /* Footer */

        footer {
            padding: 0 0 35px;
            color: #62626a;
            font-size: 0.8rem;
        }

        /* Mobile */

        @media (max-width: 600px) {
            .container {
                width: min(100% - 28px, 900px);
            }

            header {
                padding: 55px 0 40px;
            }

            .card {
                padding: 21px;
                border-radius: 15px;
            }

            .intro {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <div class="eyebrow">Podcast Series</div>

            <h1>NotebookLM Podcasts</h1>

            <p class="intro">
                Conversations and ideas generated from the
                <strong>Gemini Notebook</strong>.
                Listen to each episode below.
            </p>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="podcast-list">
                <div class="loading">
                    <span class="loading-dot"></span>
                    Loading episodes...
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            NotebookLM Podcasts
        </div>
    </footer>

    <script>
        fetch("podcasts.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load podcast data.");
                }

                return response.json();
            })

            .then(data => {
                const container =
                    document.getElementById("podcast-list");

                container.innerHTML = "";

                if (!data.length) {
                    container.innerHTML = `
                        <div class="loading">
                            No episodes available yet.
                        </div>
                    `;

                    return;
                }

                data.forEach((podcast, index) => {
                    const card = document.createElement("article");

                    card.className = "card";

                    card.innerHTML = `
                        <div class="episode-number">
                            Episode ${String(index + 1).padStart(2, "0")}
                        </div>

                        <h2>${escapeHTML(podcast.title)}</h2>

                        <p>
                            ${escapeHTML(podcast.description)}
                        </p>

                        <audio
                            controls
                            preload="metadata"
                            src="${escapeHTML(podcast.file)}">
                        </audio>
                    `;

                    container.appendChild(card);
                });
            })

            .catch(error => {
                console.error(error);

                document.getElementById("podcast-list").innerHTML = `
                    <div class="error">
                        Unable to load the podcast episodes.
                        Please try again later.
                    </div>
                `;
            });

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }
    </script>

</body>
</html>
